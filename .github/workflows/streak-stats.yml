name: Streak Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

concurrency:
  group: streak-stats
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution streak
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark&background=0D1117&border=30363D&stroke=30363D&ring=58A6FF&fire=F2CC60&currStreakNum=F0F6FC&sideNums=F0F6FC&currStreakLabel=58A6FF&sideLabels=8B949E&dates=8B949E&border_radius=6&card_width=495&card_height=195
          path: profile/streak.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
