name: Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Generate compact profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, repositories
          config_display: regular
          config_padding: 0
          config_timezone: Asia/Shanghai

          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_ignored: html, css, tex, shell

          retries: 3
          retries_delay: 60
          retries_output_action: 3
          retries_delay_output_action: 60

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          base: ""
          config_display: regular
          config_padding: 0
          config_timezone: Asia/Shanghai

          plugin_calendar: yes
          plugin_calendar_limit: 1

          retries: 3
          retries_delay: 60
          retries_output_action: 3
          retries_delay_output_action: 60
