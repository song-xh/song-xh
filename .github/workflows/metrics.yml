name: Profile Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    name: Generate profile cards
    runs-on: ubuntu-latest

    steps:
      - name: Verify METRICS_TOKEN
        env:
          PROFILE_TOKEN: ${{ secrets.METRICS_TOKEN }}
          EXPECTED_LOGIN: ${{ github.repository_owner }}
        run: |
          if [ -z "$PROFILE_TOKEN" ]; then
            echo "::error::Repository secret METRICS_TOKEN is missing."
            exit 1
          fi

          login="$(curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PROFILE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user | jq -r '.login')"

          if [ "$login" != "$EXPECTED_LOGIN" ]; then
            echo "::error::METRICS_TOKEN authenticated as '$login', expected '$EXPECTED_LOGIN'."
            exit 1
          fi

          echo "METRICS_TOKEN authenticated as $login."

      - uses: actions/checkout@v4

      - name: Generate GitHub profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 8
          EXCLUDE: "HTML,CSS,TeX,Shell"
          AUTO_PUSH: true
          THEME: "github_dark"
